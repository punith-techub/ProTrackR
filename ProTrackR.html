<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>ProTrackR</title>
    <style>
        /* --- CORE VARIABLES --- */
        :root {
            --bg-dark: #050505;
            --glass: rgba(20, 20, 20, 0.85); /* Slightly more opaque for mobile readablity */
            --border: 1px solid rgba(255, 255, 255, 0.1);
            --neon-green: #00f260;
            --neon-blue: #0575e6;
            --neon-red: #ff416c;
            --neon-yellow: #ffeb3b;
            --font: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; font-family: var(--font); -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(5, 117, 230, 0.08), transparent 25%),
                radial-gradient(circle at 90% 80%, rgba(0, 242, 96, 0.05), transparent 25%);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- UTILITIES --- */
        .hidden { display: none !important; }
        .flex { display: flex; }
        .center { align-items: center; justify-content: center; }
        
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        
        /* --- UI COMPONENTS --- */
        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: var(--border);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            transition: 0.3s;
        }

        .btn {
            cursor: pointer; border: none; padding: 10px 16px; border-radius: 8px;
            font-weight: 700; font-size: 13px; transition: 0.2s;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            user-select: none;
        }
        .btn:active { transform: scale(0.96); }
        .btn-neon { background: linear-gradient(135deg, var(--neon-green), var(--neon-blue)); color: black; }
        
        .btn-icon { background: rgba(255,255,255,0.05); color: #888; font-size: 18px; padding: 0; border-radius: 50%; width: 36px; height: 36px; display: flex; center; }
        .btn-icon:hover { background: rgba(255,255,255,0.15); color: white; }
        .location-btn { color: var(--neon-green); font-size: 20px; }

        input {
            background: rgba(0,0,0,0.5); border: 1px solid #333; color: white;
            padding: 12px; border-radius: 8px; width: 100%; transition: 0.3s; margin-bottom: 10px; font-size: 16px; /* Prevents zoom on iOS */
        }
        input:focus { border-color: var(--neon-green); }

        .chk-container { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; font-size: 13px; color: #aaa; cursor: pointer; user-select: none; }
        .chk-box { width: 18px; height: 18px; border: 1px solid #555; border-radius: 4px; display: flex; center; }
        .chk-container.checked .chk-box { background: var(--neon-blue); border-color: var(--neon-blue); }
        .chk-container.checked .chk-box::after { content: '✔'; font-size: 12px; color: white; }

        /* --- LAYOUT --- */
        header {
            height: 60px; padding: 0 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: var(--border); background: rgba(0,0,0,0.3); flex-shrink: 0;
        }
        .logo { font-size: 18px; font-weight: 900; letter-spacing: 2px; }
        
        .main-grid {
            display: grid; grid-template-columns: 260px 1fr 320px; gap: 20px; padding: 20px;
            flex: 1; overflow: hidden;
        }

        /* --- LEFT: CALENDAR --- */
        .col-left { display: flex; flex-direction: column; overflow: hidden; padding: 0; }
        .year-accordion { flex: 1; overflow-y: auto; padding: 10px; -webkit-overflow-scrolling: touch; }
        .year-block { margin-bottom: 5px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .year-header { padding: 12px; background: rgba(255,255,255,0.03); cursor: pointer; font-size: 13px; font-weight: bold; color: #888; display: flex; justify-content: space-between; user-select: none; }
        .year-header.active { background: rgba(255,255,255,0.1); color: white; border-left: 3px solid var(--neon-green); }
        .year-content { display: none; padding: 10px; }
        .year-content.open { display: block; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 15px; }
        
        .day-cell { 
            aspect-ratio: 1; background: #0f0f0f; border-radius: 4px; border: 1px solid #1a1a1a; 
            font-size: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; 
            color: #444; cursor: pointer; transition: 0.2s; user-select: none;
        }
        .day-cell:hover { border-color: #666; transform: scale(1.1); z-index: 2; }
        
        /* Glows */
        .s-low { border: 1px solid var(--neon-red); box-shadow: 0 0 5px var(--neon-red); color: var(--neon-red); background: rgba(255, 65, 108, 0.05); }
        .s-mid { border: 1px solid var(--neon-yellow); box-shadow: 0 0 5px var(--neon-yellow); color: var(--neon-yellow); background: rgba(255, 235, 59, 0.05); }
        .s-high { border: 1px solid var(--neon-green); box-shadow: 0 0 5px var(--neon-green); color: var(--neon-green); background: rgba(0, 242, 96, 0.05); }
        .day-cell.today { border: 1px solid white; box-shadow: 0 0 10px rgba(255,255,255,0.8); z-index: 5; color: white; }
        .day-cell.selected { border: 2px solid white; box-shadow: 0 0 15px white; z-index: 10; color: white; background: #222; }

        /* --- MID: DASHBOARD --- */
        .col-mid { display: flex; flex-direction: column; gap: 20px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        
        /* SCORE BOX (3 PARTS) */
        .score-box { padding: 25px; display: flex; flex-direction: column; align-items: center; }
        .score-top { text-align: center; margin-bottom: 20px; }
        .big-score { font-size: 56px; font-weight: 800; line-height: 1; color: white; text-shadow: 0 0 20px rgba(255,255,255,0.2); }
        
        .stats-row { display: flex; width: 100%; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
        .stat-item { flex: 1; text-align: center; }
        .stat-val { font-size: 20px; font-weight: bold; color: white; }
        .stat-lbl { font-size: 10px; color: #888; letter-spacing: 1px; margin-top: 2px; }

        .graph-panel { flex: 1; display: flex; flex-direction: column; min-height: 280px; }
        .tabs { display: flex; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; color: #666; font-size: 12px; font-weight: bold; border-bottom: 2px solid transparent; user-select: none; }
        .tab.active { color: white; border-bottom-color: var(--neon-green); }
        .chart-area { flex: 1; padding: 10px 20px; overflow: hidden; position: relative; }
        
        .chart-line { fill: none; stroke: var(--neon-green); stroke-width: 2; filter: drop-shadow(0 0 5px var(--neon-green)); }
        .chart-dot { fill: #000; stroke: white; stroke-width: 2; r: 3; }
        .chart-grid { stroke: #333; stroke-width: 1; stroke-dasharray: 4; }
        .chart-text { fill: #888; font-size: 10px; font-family: monospace; }

        /* --- RIGHT: TASKS --- */
        .col-right { display: flex; flex-direction: column; overflow: hidden; }
        .task-list { flex: 1; overflow-y: auto; padding: 15px; -webkit-overflow-scrolling: touch; }
        .task-item { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.03); padding: 12px; margin-bottom: 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; user-select: none; }
        .task-item:active { background: rgba(255,255,255,0.08); }
        .task-item.checked { background: rgba(0, 242, 96, 0.1); border-color: var(--neon-green); }
        .task-item.checked.neg { background: rgba(255, 65, 108, 0.1); border-color: var(--neon-red); }
        .checkbox { width: 20px; height: 20px; border: 2px solid #555; border-radius: 5px; margin-right: 12px; display: flex; center; color: black; font-size: 12px; font-weight: bold; }
        .task-item.checked .checkbox { background: var(--neon-green); border-color: var(--neon-green); }
        .task-item.checked.neg .checkbox { background: var(--neon-red); border-color: var(--neon-red); }
        .task-item.checked .checkbox::after { content: '✓'; }
        
        .action-icon { color: #555; font-size: 16px; padding: 8px; }
        .action-icon.del:active { color: var(--neon-red); }

        .creator-box { padding: 20px; background: #0a0a0a; border-top: var(--border); margin-top: auto; z-index: 10; }
        .toggle-grp { display: flex; background: #111; padding: 4px; border-radius: 6px; margin-bottom: 10px; }
        .toggle-btn { flex: 1; padding: 8px; text-align: center; font-size: 11px; font-weight: bold; color: #666; cursor: pointer; border-radius: 4px; }
        .toggle-btn.active.pos { background: var(--neon-green); color: black; }
        .toggle-btn.active.neg { background: var(--neon-red); color: white; }
        
        .recur-toggle { display: flex; align-items: center; font-size: 11px; color: #aaa; margin-bottom: 12px; cursor: pointer; }
        .recur-toggle input { width: auto; margin: 0 8px 0 0; transform: scale(1.2); }
        .day-badge { font-size: 9px; padding: 2px 5px; background: #333; color: #ccc; border-radius: 3px; margin-left: 5px; }

        /* --- MODAL --- */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-box { width: 90%; max-width: 350px; padding: 25px; border: 1px solid #333; }

        /* --- RESPONSIVE DESIGN --- */
        @media (max-width: 1000px) {
            body { overflow-y: auto; height: auto; }
            .main-grid { grid-template-columns: 1fr; display: flex; flex-direction: column; padding: 15px; }
            .col-left, .col-mid, .col-right { height: auto; margin-bottom: 20px; overflow: visible; }
            .year-accordion { max-height: 300px; border: 1px solid #222; border-radius: 8px; }
            .task-list { max-height: 400px; }
            .creator-box { position: relative; bottom: 0; }
            .graph-panel { min-height: 250px; }
            .chart-text { font-size: 8px; } /* Smaller text on mobile */
        }
    </style>
</head>
<body>

    <div id="login-screen" style="position:fixed; inset:0; background:#000; z-index:99; display:flex; align-items:center; justify-content:center;">
        <div class="glass-panel" style="width:90%; max-width:320px; padding:40px; text-align:center;">
            <h1 style="letter-spacing:4px; margin-bottom:30px; background:linear-gradient(to right, #fff, #666); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">PROTRACKR</h1>
            <input type="text" id="username" placeholder="Username" autocomplete="off">
            <input type="password" id="password" placeholder="Password">
            <div class="chk-container" id="remember-me-box" onclick="this.classList.toggle('checked')">
                <div class="chk-box"></div>
                <span>Remember Device</span>
            </div>
            <button class="btn btn-neon" style="width:100%;" onclick="handleLogin()">ENTER</button>
        </div>
    </div>

    <div id="edit-modal" class="hidden modal-overlay">
        <div class="glass-panel modal-box">
            <h3 style="margin-bottom: 15px; letter-spacing: 1px;">EDIT TASK</h3>
            <input type="text" id="edit-name" placeholder="Task Name">
            <input type="number" id="edit-pts" placeholder="Points">
            <div class="flex" style="gap: 10px; margin-top: 10px;">
                <button class="btn btn-neon" style="flex:1" onclick="saveEdit()">SAVE</button>
                <button class="btn" style="flex:1; background: #333; color: white;" onclick="closeEdit()">CANCEL</button>
            </div>
        </div>
    </div>

    <div id="app-screen" class="hidden" style="min-height:100vh; display:flex; flex-direction:column;">
        <header>
            <div class="logo">PROTRACKR</div>
            <div class="flex center" style="gap:15px;">
                <div id="user-pill" style="font-size:12px; font-weight:bold; color:white; display:none;">USER</div> <button class="btn-icon location-btn" onclick="goToToday()" title="Go to Today">&#8982;</button>
                <button class="btn-icon" onclick="exportData()" title="Export">⬆</button>
                <button class="btn-icon" onclick="document.getElementById('imp').click()" title="Import">⬇</button>
                <input type="file" id="imp" hidden onchange="importData(this)">
                <button class="btn-icon" onclick="logout()" style="color:var(--neon-red);" title="Logout">✕</button>
            </div>
        </header>

        <div class="main-grid">
            <div class="glass-panel col-left">
                <div style="padding:15px; border-bottom:var(--border); font-size:11px; font-weight:bold; color:#666;">TIMELINE (2026-2050)</div>
                <div id="year-container" class="year-accordion"></div>
            </div>

            <div class="col-mid">
                <div class="glass-panel score-box">
                    <div class="score-top">
                        <div style="font-size:11px; color:#888; letter-spacing:1px; margin-bottom:5px;">DAILY SCORE</div>
                        <div id="score-display" class="big-score">0.0</div>
                        <div id="date-display" style="font-size:13px; color:#666; margin-top:5px;">Select a date</div>
                    </div>
                    <div class="stats-row">
                        <div class="stat-item">
                            <div id="score-weekly" class="stat-val" style="color:var(--neon-blue);">0.0</div>
                            <div class="stat-lbl">7-DAY AVG</div>
                        </div>
                        <div class="stat-item">
                            <div id="score-monthly" class="stat-val" style="color:var(--neon-yellow);">0.0</div>
                            <div class="stat-lbl">MONTH AVG</div>
                        </div>
                    </div>
                </div>

                <div class="glass-panel graph-panel">
                    <div class="tabs">
                        <div class="tab active" onclick="switchGraph('weekly')">WEEKLY</div>
                        <div class="tab" onclick="switchGraph('monthly')">MONTHLY</div>
                        <div class="tab" onclick="switchGraph('yearly')">YEARLY</div>
                    </div>
                    <div class="chart-area" id="chart-container"></div>
                </div>
            </div>

            <div class="glass-panel col-right">
                <div class="task-list" id="task-list"></div>
                
                <div class="creator-box">
                    <div class="toggle-grp">
                        <div id="sw-pos" class="toggle-btn active pos" onclick="setType('pos')">POSITIVE</div>
                        <div id="sw-neg" class="toggle-btn" onclick="setType('neg')">NEGATIVE</div>
                    </div>
                    
                    <label class="recur-toggle">
                        <input type="checkbox" id="is-recurring" checked>
                        Recurring (Appears Every Day)
                    </label>

                    <div class="flex" style="gap:10px;">
                        <input type="text" id="new-name" placeholder="Task Name" style="flex:2; margin:0;">
                        <input type="number" id="new-pts" placeholder="Pts" style="flex:1; margin:0; text-align:center;">
                    </div>
                    <button class="btn btn-neon" style="width:100%; margin-top:10px;" onclick="addTask()">ADD PROTOCOL</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* --- STATE --- */
        const STORAGE_KEY = 'ProTrackR_Master_v2'; 
        let db = {};
        let currentUser = null;
        let selectedDate = new Date().toISOString().split('T')[0];
        let taskType = 'pos';
        let currentGraph = 'weekly';
        let editingTaskId = null;

        /* --- INIT --- */
        window.onload = () => {
            localStorage.removeItem(STORAGE_KEY);
            localStorage.removeItem('ProTrackR_AutoLogin');
            db = {};
        };

        function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }

        /* --- AUTH --- */
        function handleLogin() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            const remember = document.getElementById('remember-me-box').classList.contains('checked');
            if(!u || !p) return;
            if(db[u]) {
                if(db[u].password === p) {
                    if(remember) localStorage.setItem('ProTrackR_AutoLogin', u);
                    login(u);
                } else alert("Invalid Password");
            } else if(confirm("Create new user?")) {
                db[u] = { password: p, tasks: [], history: {} };
                if(remember) localStorage.setItem('ProTrackR_AutoLogin', u);
                saveData();
                login(u);
            }
        }

        function login(u) {
            currentUser = u;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('user-pill').textContent = u.toUpperCase();
            goToToday();
        }

        function logout() {
            localStorage.removeItem('ProTrackR_AutoLogin');
            location.reload();
        }

        /* --- CORE LOGIC --- */
        function goToToday() {
            const d = new Date();
            selectDate(new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().split('T')[0]);
        }

        function selectDate(d) {
            selectedDate = d;
            document.getElementById('date-display').textContent = new Date(selectedDate).toDateString();
            renderCalendar(); renderTasks(); renderScore(); renderGraph();
            const y = d.split('-')[0]; toggleYear(y, true);
        }

        /* --- TASKS --- */
        function setType(t) {
            taskType = t;
            document.getElementById('sw-pos').className = `toggle-btn ${t==='pos'?'active pos':''}`;
            document.getElementById('sw-neg').className = `toggle-btn ${t==='neg'?'active neg':''}`;
        }
        
        function addTask() {
            const n = document.getElementById('new-name').value.trim();
            const p = parseFloat(document.getElementById('new-pts').value);
            const isRecur = document.getElementById('is-recurring').checked;
            
            if(!n || isNaN(p) || p <= 0) {
                alert("Please enter a valid task name and points greater than 0.");
                return;
            }
            
            db[currentUser].tasks.push({ 
                id: 't'+Date.now(), name: n, pts: p, type: taskType,
                date: isRecur ? null : selectedDate 
            });
            saveData();
            document.getElementById('new-name').value = '';
            document.getElementById('new-pts').value = '';
            
            renderTasks(); renderScore();
            const list = document.getElementById('task-list');
            list.scrollTop = list.scrollHeight;
        }

        function toggleTask(id) {
            const h = db[currentUser].history;
            if(!h[selectedDate]) h[selectedDate] = [];
            const idx = h[selectedDate].indexOf(id);
            if(idx > -1) h[selectedDate].splice(idx,1); else h[selectedDate].push(id);
            saveData();
            renderTasks(); renderScore(); renderCalendar(); renderGraph();
        }

        /* --- EDIT FEATURE --- */
        function openEdit(id) {
            const task = db[currentUser].tasks.find(t => t.id === id);
            if(!task) return;
            editingTaskId = id;
            document.getElementById('edit-name').value = task.name;
            document.getElementById('edit-pts').value = task.pts;
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEdit() {
            document.getElementById('edit-modal').classList.add('hidden');
            editingTaskId = null;
        }

        function saveEdit() {
            if(!editingTaskId) return;
            const n = document.getElementById('edit-name').value.trim();
            const p = parseFloat(document.getElementById('edit-pts').value);
            if(!n || isNaN(p) || p <= 0) { alert("Invalid input"); return; }
            const task = db[currentUser].tasks.find(t => t.id === editingTaskId);
            if(task) { task.name = n; task.pts = p; saveData(); renderTasks(); renderScore(); renderGraph(); closeEdit(); }
        }

        function deleteTask(id) {
            if(confirm("Delete task?")) {
                db[currentUser].tasks = db[currentUser].tasks.filter(t=>t.id!==id);
                saveData(); renderTasks(); renderScore();
            }
        }

        function getDailyTasks() {
            return db[currentUser].tasks.filter(t => !t.date || t.date === selectedDate);
        }

        function getScore(dStr) {
            const u = db[currentUser];
            const checks = u.history[dStr] || [];
            const validTasks = u.tasks.filter(t => !t.date || t.date === dStr);
            let total = 0, earned = 0;
            validTasks.forEach(t => {
                if(t.type === 'pos') { total += t.pts; if(checks.includes(t.id)) earned += t.pts; } 
                else { if(checks.includes(t.id)) earned -= t.pts; }
            });
            if(total === 0) return 0;
            return Math.max(0, Math.min(10, (earned/total)*10));
        }

        /* --- RENDERING --- */
        function renderTasks() {
            const u = db[currentUser];
            const checks = u.history[selectedDate] || [];
            const list = document.getElementById('task-list');
            const tasksToShow = getDailyTasks();
            
            if(tasksToShow.length === 0) {
                list.innerHTML = `<div style="text-align:center; color:#555; margin-top:40px; font-style:italic;">No protocols for this day.</div>`;
                return;
            }

            const mkItem = (t) => `
                <div class="task-item ${checks.includes(t.id)?'checked':''} ${t.type==='neg'?'neg':''}" onclick="toggleTask('${t.id}')">
                    <div class="flex center">
                        <div class="checkbox"></div>
                        <div style="display:flex; flex-direction:column; align-items:flex-start;">
                            <span style="font-weight:600; font-size:13px;">${t.name}</span>
                            ${t.date ? '<span class="day-badge">DAY ONLY</span>' : ''}
                        </div>
                    </div>
                    <div class="flex center">
                        <span style="font-size:10px; font-weight:bold; margin-right:10px; color:${t.type==='pos'?'var(--neon-green)':'var(--neon-red)'}">${t.pts} pts</span>
                        <span class="action-icon" onclick="event.stopPropagation(); openEdit('${t.id}')">✎</span>
                        <span class="action-icon del" onclick="event.stopPropagation(); deleteTask('${t.id}')">×</span>
                    </div>
                </div>`;

            list.innerHTML = `<div style="font-size:10px; font-weight:bold; color:#666; margin-bottom:5px;">POSITIVES</div>` +
                             tasksToShow.filter(t=>t.type==='pos').map(mkItem).join('') +
                             `<div style="font-size:10px; font-weight:bold; color:#666; margin:15px 0 5px;">NEGATIVES</div>` +
                             tasksToShow.filter(t=>t.type==='neg').map(mkItem).join('');
        }

        function renderScore() {
            // 1. Today Score
            const s = getScore(selectedDate);
            const el = document.getElementById('score-display');
            el.textContent = s.toFixed(1);
            el.style.color = s < 4 ? '#ff416c' : (s < 7.5 ? '#ffeb3b' : '#00f260');

            // 2. Weekly Avg (Last 7 days relative to selected date)
            let wSum = 0;
            for(let i=0; i<7; i++) {
                let d = new Date(selectedDate); d.setDate(d.getDate() - i);
                wSum += getScore(d.toISOString().split('T')[0]);
            }
            document.getElementById('score-weekly').textContent = (wSum / 7).toFixed(1);

            // 3. Monthly Avg (All days in the month of selected date)
            let mSum = 0, mDays = 0;
            const y = parseInt(selectedDate.split('-')[0]);
            const m = parseInt(selectedDate.split('-')[1]);
            const dim = new Date(y, m, 0).getDate();
            for(let d=1; d<=dim; d++) {
                 let ds = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                 mSum += getScore(ds);
                 mDays++;
            }
            document.getElementById('score-monthly').textContent = (mSum / mDays).toFixed(1);
        }

        /* --- CALENDAR --- */
        function renderCalendar() {
            const container = document.getElementById('year-container');
            if(container.innerHTML === "") {
                for(let y=2026; y<=2050; y++) {
                    container.innerHTML += `
                        <div class="year-block">
                            <div class="year-header" id="yh-${y}" onclick="toggleYear('${y}')"><span>${y}</span><span>▼</span></div>
                            <div class="year-content" id="yc-${y}"></div>
                        </div>`;
                }
            }
        }

        function toggleYear(year, forceOpen=false) {
            const content = document.getElementById(`yc-${year}`);
            const header = document.getElementById(`yh-${year}`);
            if(!content) return; 
            if(!forceOpen && content.classList.contains('open')) { content.classList.remove('open'); header.classList.remove('active'); return; }
            document.querySelectorAll('.year-content').forEach(el => el.classList.remove('open'));
            document.querySelectorAll('.year-header').forEach(el => el.classList.remove('active'));
            content.classList.add('open'); header.classList.add('active');
            if(content.innerHTML === "") {
                const months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
                let html = "";
                months.forEach((m, i) => {
                    html += `<div style="font-size:10px; font-weight:bold; color:#666; margin-bottom:5px;">${m}</div><div class="cal-grid">`;
                    const dim = new Date(year, i+1, 0).getDate();
                    for(let d=1; d<=dim; d++) {
                        const dStr = `${year}-${String(i+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                        html += `<div class="day-cell" id="d-${dStr}" onclick="selectDate('${dStr}')">${d}</div>`;
                    }
                    html += `</div>`;
                });
                content.innerHTML = html;
            }
            updateYearColors(year);
            setTimeout(() => { const sel = document.getElementById(`d-${selectedDate}`); if(sel) sel.scrollIntoView({behavior:"smooth", block:"center"}); }, 100);
        }

        function updateYearColors(year) {
            const u = db[currentUser];
            const content = document.getElementById(`yc-${year}`);
            if(!content) return;
            content.querySelectorAll(`.day-cell`).forEach(cell => {
                const dStr = cell.id.replace('d-', '');
                cell.className = 'day-cell';
                if(dStr === selectedDate) cell.classList.add('selected');
                const todayStr = new Date().toISOString().split('T')[0];
                if(dStr === todayStr) cell.classList.add('today');
                const s = getScore(dStr);
                const hasHistory = u.history[dStr] && u.history[dStr].length > 0;
                if(hasHistory) {
                    if(s < 4) cell.classList.add('s-low');
                    else if(s < 7.5) cell.classList.add('s-mid');
                    else cell.classList.add('s-high');
                }
            });
        }

        /* --- GRAPHS --- */
        function switchGraph(type) {
            currentGraph = type;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab')[type==='weekly'?0 : type==='monthly'?1 : 2].classList.add('active');
            renderGraph();
        }

        function renderGraph() {
            const container = document.getElementById('chart-container');
            const data = [];
            
            if(currentGraph === 'weekly') {
                for(let i=6; i>=0; i--) {
                    let d = new Date(selectedDate); d.setDate(d.getDate()-i);
                    let ds = d.toISOString().split('T')[0];
                    data.push({ lbl: d.getDate(), val: getScore(ds) });
                }
            } else if(currentGraph === 'monthly') {
                const pts = selectedDate.split('-'); const y = parseInt(pts[0]), m = parseInt(pts[1]);
                const dim = new Date(y, m, 0).getDate();
                for(let d=1; d<=dim; d++) {
                    let ds = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    data.push({ lbl: d, val: getScore(ds) });
                }
            } else {
                const y = parseInt(selectedDate.split('-')[0]); const mons = ["J","F","M","A","M","J","J","A","S","O","N","D"];
                for(let m=0; m<12; m++) {
                    let t=0, c=0;
                    for(let d=1; d<=31; d++) {
                        let date = new Date(y, m, d); if(date.getMonth() !== m) break;
                        let ds = date.toISOString().split('T')[0];
                        if(db[currentUser].history[ds]) { t += getScore(ds); c++; }
                    }
                    data.push({ lbl: mons[m], val: c?t/c:0 });
                }
            }
            
            if(data.length === 0) return;
            const w = container.offsetWidth || 300; const h = 200; 
            const gw = w - 60; const gh = h - 60;
            const step = gw / (data.length - 1 || 1);
            let path = `M 30 ${h - 30 - (data[0].val/10)*gh}`;
            let dots = '';
            
            data.forEach((d, i) => {
                const x = 30 + i*step; const y = h - 30 - (d.val/10)*gh;
                if(i>0) path += ` L ${x} ${y}`;
                dots += `<circle cx="${x}" cy="${y}" class="chart-dot"><title>${d.lbl}: ${d.val.toFixed(1)}</title></circle>`;
                
                // MOBILE OVERLAP FIX: Skip labels on small screens if dense data (monthly)
                if(window.innerWidth < 600 && data.length > 20 && i % 3 !== 0 && i !== data.length-1) {
                    // Skip label
                } else {
                    let anchor = "middle";
                    if(i===0) anchor="start"; if(i===data.length-1) anchor="end";
                    dots += `<text x="${x}" y="${h-10}" class="chart-text" text-anchor="${anchor}">${d.lbl}</text>`;
                }
            });
            container.innerHTML = `<svg width="100%" height="100%" style="overflow:visible;"><line x1="30" y1="30" x2="30" y2="${h-30}" class="chart-grid"/><line x1="30" y1="${h-30}" x2="${w-30}" y2="${h-30}" class="chart-grid"/><path d="${path}" class="chart-line" />${dots}</svg>`;
        }

        /* --- IMPORT/EXPORT (CRASH PROOF) --- */
        function exportData() {
            const a = document.createElement('a'); a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
            a.download = "protrackr.json"; document.body.appendChild(a); a.click(); a.remove();
        }
        function importData(el) {
            const r = new FileReader(); 
            r.onload = e => { 
                try { 
                    const d = JSON.parse(e.target.result);
                    if(!d[Object.keys(d)[0]].tasks) { alert("Error: Old or incompatible file format."); return; }
                    db = d; saveData(); location.reload(); 
                } catch(e) { alert('Invalid File'); } 
            };
            if(el.files[0]) r.readAsText(el.files[0]);
        }
    </script>
</body>
